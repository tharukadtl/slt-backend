name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest ships a real, running Docker Server pre-installed (confirmed
      # against actions/runner-images' own Ubuntu 24.04 readme, not assumed) --
      # Testcontainers needs nothing extra to reach it.
      - name: Run tests
        run: ./mvnw test

      # Surefire already writes JUnit XML to target/surefire-reports/ with no
      # config needed -- this just reads what's already there, splitting the
      # one real `mvn test` run into labeled sections by package instead of
      # re-running Testcontainers per category. if: always() so a summary
      # appears even when tests fail, which is when it matters most.
      # ubuntu-latest ships python3 by default, no setup step needed.
      - name: Test summary
        if: always()
        run: |
          python3 .github/scripts/summarize_junit.py "target/surefire-reports/TEST-*.xml" \
            --group "Unit Tests=lk.slt.fieldops.service.,lk.slt.fieldops.dto.,lk.slt.fieldops.config." \
            --group "API/Integration Tests=lk.slt.fieldops.controller.,lk.slt.fieldops.websocket." \
            --group "Security Tests=lk.slt.fieldops.security."

      # JaCoCo's `report` execution (pom.xml, bound to the test phase) already
      # wrote target/site/jacoco/ during `mvn test` above when every test
      # passed. But Surefire fails the build the instant a test fails, which
      # aborts the reactor before that same-phase report execution gets to
      # run -- so on a red build target/site/jacoco/ would otherwise never
      # exist. `jacoco:report` run bare doesn't re-execute tests: it just
      # reads the target/jacoco.exec this JVM already wrote and the classes
      # `mvn test` already compiled, so this is a real no-op when the report
      # above already ran, and the only way to get coverage when tests fail.
      - name: Generate coverage report
        if: always()
        run: ./mvnw jacoco:report

      # Upload both the coverage report and the raw Surefire XML so they're
      # downloadable from the run regardless of pass/fail.
      - name: Upload test & coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/*.xml
            target/site/jacoco/
          retention-days: 30
