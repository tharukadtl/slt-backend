name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest ships a real, running Docker Server pre-installed (confirmed
      # against actions/runner-images' own Ubuntu 24.04 readme, not assumed) --
      # Testcontainers needs nothing extra to reach it.
      - name: Run tests
        run: ./mvnw test

      # Surefire already writes JUnit XML to target/surefire-reports/ with no
      # config needed -- this just reads what's already there. if: always()
      # so a summary appears even when tests fail, which is when it matters
      # most. ubuntu-latest ships python3 by default, no setup step needed.
      - name: Test summary
        if: always()
        run: python3 .github/scripts/summarize_junit.py "target/surefire-reports/TEST-*.xml"
