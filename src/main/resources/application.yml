spring:
  datasource:
    # No insecure defaults: SPRING_DATASOURCE_USERNAME/PASSWORD are required env vars
    # (or come from application-local.yml under the "local" profile — see README.md).
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/slt_fieldops_db?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    time-zone: Asia/Colombo
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  websocket:
    message-size-limit: 8192
    send-buffer-size-limit: 512000
    send-time-limit: 20000

server:
  port: ${SERVER_PORT:8080}

# ══════════════════════════════════════════════════════════
# APP CONFIG
# ══════════════════════════════════════════════════════════
app:

  # ── JWT ─────────────────────────────────────────────────
  jwt:
    # No insecure default: JWT_SECRET is a required env var (or comes from
    # application-local.yml under the "local" profile — see README.md). A
    # hardcoded fallback here would mean anyone reading this file could forge
    # valid tokens for any deployment that forgot to override it.
    secret: ${JWT_SECRET}
    access-token-expiry-ms: ${JWT_EXPIRATION_MS:1800000}
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  # ── OTP ─────────────────────────────────────────────────
  otp:
    expiry-minutes: 5
    max-attempts: 3
    resend-cooldown-seconds: 60
    rate-limit-window-minutes: 10
    rate-limit-max-requests: 3
    account-lock-minutes: 15

  # ── SMS ─────────────────────────────────────────────────
  sms:
    enabled: false

  # ── Rate Limiting ─────────────────────────────────────────
  rate-limit:
    max-requests-per-minute: 100
    provider: mock

  # ── Firebase Push Notifications ─────────────────────────
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:src/main/resources/firebase/serviceAccountKey.json}
    enabled: false
    project-id: ${FIREBASE_PROJECT_ID:slt-fieldops}

  # ── WebSocket ────────────────────────────────────────────
  websocket:
    location-endpoint: /ws/location
    notification-endpoint: /ws/notifications
    allowed-origins: "*"

  # ── CORS ─────────────────────────────────────────────────
  cors:
    allowed-origins:
      - ${ALLOWED_ORIGINS:http://localhost:3000}
      - http://localhost:3001
      - http://localhost:8081
      - http://localhost:19000
      - http://localhost:19001
      - http://10.0.2.2:8080
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  # ── Stock Alerts ─────────────────────────────────────────
  stock:
    low-stock-check-interval-minutes: 30
    alert-enabled: true

  # ── Reports ──────────────────────────────────────────────
  reports:
    export-dir: temp/reports
    max-export-days: 90

  # ── AI Module (Flask, used by REP-06/REP-07 report export) ─
  ai:
    base-url: ${AI_MODULE_URL:http://localhost:5000}

  # ── File Uploads ─────────────────────────────────────────
  uploads:
    dir: uploads

  # ── Location ─────────────────────────────────────────────
  location:
    active-threshold-minutes: 30
    update-interval-seconds: 30

# ══════════════════════════════════════════════════════════
# LOGGING
# ══════════════════════════════════════════════════════════
logging:
  level:
    lk.slt.fieldops: DEBUG
    lk.slt.fieldops.websocket: DEBUG
    lk.slt.fieldops.service: DEBUG
    lk.slt.fieldops.controller: INFO
    org.springframework.security: INFO
    org.springframework.web.socket: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/slt-fieldops.log
    max-size: 10MB
    max-history: 30

# ══════════════════════════════════════════════════════════
# ACTUATOR — Health Monitoring
# ══════════════════════════════════════════════════════════
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, env
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

